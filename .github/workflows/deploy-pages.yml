# Deploy the built PWA to GitHub Pages (free, no secrets needed).
# ফিল্ড আমিন সংস্করণ: স্বয়ংক্রিয় ডিপ্লয় বন্ধ (ধাপ ১০-এ সিদ্ধান্ত হবে)।
# এখন শুধু হাতে চালানো যায় (Actions → Run workflow), আর এটা শুধু এই রিপোর gh-pages-এ যায় —
# পুরোনো রিপো mehedifeni33-del/bhumi-o-amin-এ কখনো না।
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (GitHub Pages base path)
        env:
          GH_PAGES: 'true'
        run: npm run build

      # GitHub Pages has no SPA rewrites; serve a 404 fallback so deep links work.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
