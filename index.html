<!doctype html>
<html lang="bn">
  <head>
    <script>
      // Filter benign Vite websocket disconnection notices in sandboxed preview iframe
      (function() {
        var _err = console.error;
        var _warn = console.warn;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('vite-plugin-pwa') !== -1)) {
            return;
          }
          return _err.apply(console, arguments);
        };
        console.warn = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('vite-plugin-pwa') !== -1)) {
            return;
          }
          return _warn.apply(console, arguments);
        };
      })();
    </script>
    <meta charset="UTF-8" />
